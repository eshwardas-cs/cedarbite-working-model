[build]
  command = "npm --prefix frontend ci && npm --prefix frontend run build"
  publish = "backend/app/web"

[functions]
  directory = "frontend/netlify/functions"

[functions."order-notification-scheduler"]
  schedule = "* * * * *"

[[redirects]]
  from = "/stations"
  to = "/index.html"
  status = 200

