<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17372f" />
    <meta name="description" content="CedarBite canteen ordering project" />
    <title>CedarBite — campus canteen</title>
    <style>
      .boot-fallback{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fafc;color:#102b4c;font:500 16px/1.5 system-ui,sans-serif;text-align:center}
      .boot-fallback-card{max-width:440px;padding:36px;border:1px solid #dbe5ef;border-radius:24px;background:#fff;box-shadow:0 16px 48px #102b4c12}
      .boot-fallback-mark{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 18px;border-radius:18px;background:#ffc928;color:#102b4c;font-size:28px;font-weight:800}
      .boot-fallback h1{margin:0 0 8px;font-size:24px}.boot-fallback p{margin:0;color:#53657b}
    </style>
  </head>
  <body>
    <div id="root"><main class="boot-fallback"><section class="boot-fallback-card"><div class="boot-fallback-mark" aria-hidden="true">C</div><h1>CedarBite is loading</h1><p>If this message stays on screen, reload the page.</p></section></main></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
